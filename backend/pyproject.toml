[project]
name = "vasp-attribution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "celery",
    "redis",
    "neo4j",
    "psycopg[binary]",
    "httpx",
    "pydantic-settings",
    "weasyprint",
    "pyyaml",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
