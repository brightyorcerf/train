# Token / LP CONTRACTS that TagPacks labels as exchange infrastructure (§6 curation fix).
#
# Why this file exists: the packs tag a token contract with its issuer's name — 'BitgetToken
# (BGB)', 'Bitfinex LEO Token', 'KuCoin: Old KCS Token', 'Binance USD' — and ingest turned that
# into a `hot` label, i.e. a legitimate SWEEP TARGET (§6.2c). A token contract can never be one:
# nobody's deposit address sweeps into the token's own contract. Left alone, any address that
# happened to send tokens there would be 'proven' a deposit address of that exchange.
#
# Evidence, not names: each address below was confirmed a token contract by asking Etherscan for
# transfers where contractaddress = the address (a wallet returns none). Candidates were picked
# by tag name; only this on-chain test decided. Verified 2026-09-12.
#
# ingest.py gives these the `token` role instead of hot/deposit/dex, so they stay visible in
# provenance but can never be crowned, swept to, or treated as a service boundary.

