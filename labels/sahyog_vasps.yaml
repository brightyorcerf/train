# SAHYOG-onboarded VASPs (§6.2a, §17) — curated. Only entries with a public source are listed.
# "45+ VASPs onboarded" is public; the full list is not. Add an entity only with a citable source.
#
# entity: canonical id (matches graphsense actorpack ids, see labels/registry.py)
# addresses: curated deposit / hot / withdrawal addresses — ONLY with provenance.
#   Our own manufactured deposits live in ground_truth_deposits.yaml, not here.
#   Exchange-published reserve/hot wallets come from TagPacks at a lower tier (ingest.py).
- entity: wazirx
  name: WazirX
  jurisdiction: IN
  sahyog: confirmed
  source: https://crypto.news/bitget-joins-indias-i4c-sahyog-portal-to-support-digital-asset-law-enforcement/
  addresses:
    # WazirX's own incident report names it; a 4-of-6 Safe multisig (ETH hot wallet). Drained
    # 2024-07-18 06:19 UTC after an implementation swap — WazirX infra BEFORE that, attacker-controlled
    # after. ponytail: validity window is in the note only, not enforced; add per-label valid_until
    # if a trace ever needs a post-hack snapshot through this wallet.
    - address: "0x27fD43BABfbe83a81d14665b1a6fB8030A60C9b4"
      chain: eth
      role: hot
      source: https://wazirx.com/blog/preliminary-report-cyber-attack-on-wazirx-multisig-wallet/ (valid until 2024-07-18)
