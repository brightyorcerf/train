      chain: eth
      note: Core Bridge (message layer). on-chain 2026-09-12 contract=true, 4 txs/100k blocks
    - address: "0x3ee18B2214AFF97000D974cf647E7C347E8fa585"
      chain: eth
      note: Token Bridge (the one that moves value). on-chain contract=true, >=1000 txs/100k blocks
    - address: "0x6FFd7EdE62328b3Af38FCD61461Bbfc52F5651fE"
      chain: eth
      note: NFT Bridge. listed for completeness; not a value rail for our purposes

