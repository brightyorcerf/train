# Hand-curated cross-chain bridge contracts (§9.3 BROKEN_AT_BRIDGE). Until this file existed the
# BROKEN_AT_BRIDGE state was dead code — nothing could ever set it.
#
# Curation rules, applied to every address below:
#   1. the address comes from the PROJECT'S OWN deployment data (repo file or its own docs site),
#      or, where the project is defunct and its docs are gone, from a named third-party index —
#      recorded per entry in `source`, with the tier that implies;
#   2. I corroborated each one on-chain myself with our adapter on 2026-09-12 (eth tip 25959318):
#      `contract=true` plus a transaction count over the last 100,000 blocks. That check proves the
#      address is a live contract; it cannot prove its identity — the source does that.
#
# DESTINATION CHAIN — READ THIS BEFORE QUOTING THE OUTPUT:
# a bridge contract serves many destinations, and the destination of any single transfer is encoded
# in that transaction's call data. We do NOT decode call data (Etherscan V2 marks `input` deprecated
# — see providers/etherscan_v2.py), so we emit the bridge contract plus the chains that bridge
# serves, and never a per-transaction destination. Decoding the destination is named future work,
# not a claim this prototype makes.
#
# role: bridge  ·  every entry is a §9.3 STOP boundary: "subpoena the bridge operator".

