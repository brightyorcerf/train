- id: potekhin-karasavidi-bitfinex
  suspect_addr: '0x7F367cC41522cE07553e823bf3be79A889DEbe1B'
  chain: eth
  until_block: 25906777
  expect: ATTRIBUTED
  expected_entity: bitfinex
  min_hops: 3
  endpoint: '0xd882cfc20f52f2599d84b8e8d58c7fb62cfe344b'   # sweep_proven
  verified: >
    2026-09-12 hand-walked against Etherscan (day 7a). All three hops are plain ETH value
    transfers, status 1, input 0x, no logs (1756.99 -> 5845.38 -> 7112.71 ETH); both intermediates
    (0x2718752b…, 0x6f6394dc…) are unlabeled EOAs with 8 and 3 lifetime movements — no hub, mixer or
    DEX on the path. The endpoint sends 100% of all 11 of its ETH spends to Bitfinex hot wallet
    0x876eabf441b2ee5b5b0554fd502a8e0600950cfa (labeled from bitfinexcom/pub/wallets.txt), and
    received from 11 distinct senders before the sweep.
  caveat: >
    the endpoint is ITSELF OFAC-listed (Karasavidi Dmitrii, same 2020-09-16 designation as the
    suspect Potekhin). Treasury says he "laundered the proceeds of the attacks into an account in his
    name" and that the funds "was traced to Karasavidi's account" — consistent with a personal deposit
    address at an exchange, but Treasury never names Bitfinex. The exchange identity rests on
    Bitfinex's published hot-wallet list + the sweep behaviour, NOT on the government document.
    Separately: the endpoint trips the truncated/hub flag, but 4,972 of its 4,996 txlist rows are
    zero-value address-poisoning spam and only 24 are real value transfers (hub rule counts raw rows).
  source_doc: https://home.treasury.gov/news/press-releases/sm1123
- id: wuhuihui-binance
  suspect_addr: 12w6v1qAaBc4W8h8C2Cu5SKFaKDSv3erUW
  chain: btc
  expect: ATTRIBUTED
  expected_entity: binance
  min_hops: 2          # shallow for a discovery case, but the endpoint is sweep-proven, not labeled
  endpoint: 19msUPsm7cHG8pGTavUr2AeZJsoRTNju1P   # sweep_proven
  verified: >
    2026-09-12 hand-walked from the raw store (0 upstream calls). Hop 1 (bc4b0754) is a
    single-input spend BY the suspect: 4.7850 BTC in, paying 4.2272 to 1Gog6U87… plus 0.5578
    change. Hop 2 (5ee42bd3) spends that same 4.2272 UTXO unsplit as one of 13 inputs
    (10 distinct addresses, 54.8066 BTC total) and pays 50.0 BTC to the deposit address —
    1Gog6U87… is provably an input, so the suspect's coin is inside the deposit. Every input is
    4.18-4.27 BTC, i.e. a uniform consolidation batch rather than arbitrary pooling. annotate()
    reports no coinjoin and no change output on hop 2. The endpoint then sweeps 100.0% of
    tx d4e0c06b to labeled Binance hot wallet 1NDyJtNTjmwk5xPNhjgAMu4HDHigtobu1s; sweep "proven".
    The intermediate is 69 funded / 68 spent txos — busy, but far below the 1,000-receipt hub bar.
  caveat: >
    the suspect is NOT itself an input to the hop-2 deposit tx, and that tx aggregates 13 inputs,
    so the suspect funds only ~7.7% of the 50 BTC that lands at Binance. The claim this case
    supports is "the suspect's funds reached this Binance deposit address", NOT that the deposit
    is solely theirs. distinct_senders on the sweep is reported as 27 with senders_truncated=true,
    so 27 is a floor, not a count.
  source_doc: OFAC SDN sdn_advanced.xml, listed 2023-04-24, individual:DPRK3 (Wu Huihui)
